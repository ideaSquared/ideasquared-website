# `ship rollback ideasquared-website [staging|production]` starts this: shipper redeploys an earlier commit
# that was live in that environment, through the normal pipeline (deploy, health check, Discord).
name: Ship rollback

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to roll back
        required: true
        type: string
      sha:
        description: Commit to deploy
        required: true
        type: string

concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  rollback:
    permissions:
      contents: read
      checks: read
      deployments: write
    uses: ideaSquared/shipper/.github/workflows/deploy.yml@v1
    with:
      environment: ${{ inputs.environment }}
      sha: ${{ inputs.sha }}
      rollback: true
    secrets: inherit
