# Uploads a preview version of the production Worker for every pull request from this repo and keeps one
# comment on the PR with its URL. This is not a deploy: `wrangler versions upload` creates a version that
# receives no production traffic (shipper still deploys, from ci.yml). The URL is
# https://pr-<number>-ideasquared-website.<workers.dev subdomain>.workers.dev (preview_urls in wrangler.jsonc).
#
# Skipped for forks and Dependabot: neither can read the `preview` Environment's secrets.
name: Preview

on:
  pull_request:
    types: [opened, synchronize, reopened]

# One preview per PR; a newer push cancels the one still uploading.
concurrency:
  group: preview-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  WRANGLER_SEND_METRICS: false

jobs:
  preview:
    name: Preview
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: preview
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # No install scripts: this job holds Cloudflare credentials and runs the PR's code.
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Upload the preview version
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-output.json
        run: |
          pnpm exec wrangler versions upload --env= \
            --preview-alias "pr-${PR_NUMBER}" \
            --message "Preview of PR ${PR_NUMBER} at ${HEAD_SHA:0:7}"
      - name: Read the preview URL
        id: url
        env:
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-output.json
        run: |
          url=$(jq -rs '[.[] | select(.type == "version-upload")] | last | .preview_alias_url // empty' "$WRANGLER_OUTPUT_FILE_PATH")
          case "$url" in
            https://*) echo "url=$url" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::wrangler printed no preview alias URL. Check preview_urls in wrangler.jsonc and that the account has a workers.dev subdomain."; exit 1 ;;
          esac
      # One sticky comment: found by its hidden marker (and the bot as author) and edited, never duplicated.
      - name: Post or update the preview comment
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PREVIEW_URL: ${{ steps.url.outputs.url }}
        run: |
          marker='<!-- ideasquared-website-preview -->'
          body=$(printf '%s\n**Preview** for %s: %s\n\nA version of the production Worker with no production traffic. It updates on every push to this PR.' "$marker" "${HEAD_SHA:0:7}" "$PREVIEW_URL")
          id=$(gh api --paginate "repos/${REPO}/issues/${PR_NUMBER}/comments" \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | contains(\"${marker}\"))) | .id" | head -n 1)
          if [ -n "$id" ]; then
            gh api --method PATCH "repos/${REPO}/issues/comments/${id}" -f body="$body" > /dev/null
          else
            gh api --method POST "repos/${REPO}/issues/${PR_NUMBER}/comments" -f body="$body" > /dev/null
          fi
