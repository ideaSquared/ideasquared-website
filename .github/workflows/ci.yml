name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  WRANGLER_SEND_METRICS: false

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      # No typecheck step: the repo has no TypeScript. No build step: the HTML is published as written.
      - run: pnpm test
